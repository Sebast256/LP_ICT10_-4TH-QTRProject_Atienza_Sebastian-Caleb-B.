    <div class="container">
    <h1>Grade 10 Classmates System</h1>

    <label>Name:</label>
    <input type="text" id="name">
    <br>
    <label>Section:</label>
    <input type="text" id="section">
    <br>
    <label>Favorite subject:</label>
    <input type="text" id="subject">

    <button onclick="addClassmate()">Add Classmate</button>
    <button onclick="showList()">Show List</button>

    <ul id="list"></ul>
</div>

<script>
let classmates = [];

function addClassmate() {
    let name = document.getElementById("name").value;
    let section = document.getElementById("section").value;
    let subject = document.getElementById("subject").value;

    classmates.push({name, section, subject});

    alert("Classmate added!");
}

function showList() {
    let list = document.getElementById("list");
    list.innerHTML = "";

    classmates.forEach(c => {
        let li = document.createElement("li");
        li.textContent = `${c.name} - ${c.section} - ${c.subject}`;
        list.appendChild(li);
    });
}
</script>
